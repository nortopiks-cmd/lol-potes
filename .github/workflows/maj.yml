name: Mise à jour du classement

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maj-classement
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les parties et créer la page
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TZ: Europe/Paris
        run: python lolpotes.py --site

      - name: Enregistrer la page et le cache
        run: |
          git config user.name "lolpotes-bot"
          git config user.email "lolpotes-bot@users.noreply.github.com"
          git add docs cache
          git diff --cached --quiet || git commit -m "Mise à jour du classement"
          git push
